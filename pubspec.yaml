name: mobeehive
description: Mobeehive – aplikacja do prowadzenia pasieki.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.3.3
  path: ^1.9.0
  uuid: ^4.4.0
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  intl: any
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  geolocator: ^13.0.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: assets/icon-background.png
  adaptive_icon_foreground: assets/icon-foreground.png
  min_sdk_android: 21
